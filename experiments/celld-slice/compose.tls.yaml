services:
  postgres-tls:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    profiles: [tls]
    environment:
      POSTGRES_USER: slice
      POSTGRES_PASSWORD: slice-local-only
      POSTGRES_DB: slice
    volumes:
      - ./results/tls:/fixture-tls:ro
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - bash
      - -ec
      - |
        install -o postgres -g postgres -m 600 /fixture-tls/server.key /tmp/slice-server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/fixture-tls/server.crt -c ssl_key_file=/tmp/slice-server.key -c hba_file=/fixture-tls/pg_hba.conf
    healthcheck:
      test: [CMD-SHELL, pg_isready -U slice -d slice]
      interval: 2s
      timeout: 5s
      retries: 30
