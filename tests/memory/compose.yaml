services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_PASSWORD: ${MEMORY_TEST_SECRET:?}
      POSTGRES_DB: memory_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cerebro -d memory_test]
      interval: 1s
      timeout: 5s
      retries: 30
  minio:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
      target: minio
    entrypoint: [minio]
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: memory-test
      MINIO_ROOT_PASSWORD: ${MEMORY_TEST_SECRET:?}
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:9000/minio/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 1s
      timeout: 5s
      retries: 30
