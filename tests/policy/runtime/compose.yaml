x-runtime: &runtime
  image: ${COMPOSE_PROJECT_NAME:-cerebro-policy-runtime}-app
  volumes:
    - ${CEREBRO_S4_WORKTREE:?set worktree}:/workspace:ro
    - bundle:/run/s4
x-storage: &storage
  AWS_ACCESS_KEY_ID: s4-fixture-only
  AWS_SECRET_ACCESS_KEY: s4-fixture-only-storage-secret
  AWS_REGION: us-east-1
services:
  minio:
    image: ${COMPOSE_PROJECT_NAME:-cerebro-policy-runtime}-minio
    build:
      context: ../../..
      dockerfile: tests/runtime/Dockerfile
      target: minio
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: s4-fixture-only
      MINIO_ROOT_PASSWORD: s4-fixture-only-storage-secret
    volumes: ["minio:/data"]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:9000/minio/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 5s
      retries: 40
  bootstrap:
    <<: *runtime
    build:
      context: ../../..
      dockerfile: tests/runtime/Dockerfile
      target: dependencies
    command: [node, /workspace/tests/policy/runtime/bootstrap.mjs]
    environment:
      <<: *storage
    depends_on:
      minio:
        condition: service_healthy
  celld:
    <<: *runtime
    command:
      [
        celld,
        --bucket,
        "s3://cerebro-s4-runtime",
        --endpoint,
        "http://minio:9000",
        --region,
        us-east-1,
        --listen,
        "0.0.0.0:8080",
        --internal-listen,
        "0.0.0.0:8081",
        --advertise,
        "celld:8081",
      ]
    environment:
      <<: *storage
      CELLD_WATCH: /run/celld/state
      CELLD_DURABILITY: bucket
      CELLD_TELEMETRY: "0"
      CELLD_V8_HEAP_LIMIT_MB: "256"
      CELLD_IDLE_EVICT_S: "10"
      CELLD_MAX_RESIDENT_CELLS: "16"
    ports: ["127.0.0.1::8080"]
    volumes:
      - ${CEREBRO_S4_WORKTREE:?set worktree}:/workspace:ro
      - bundle:/run/s4
      - celld:/run/celld
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 5s
      retries: 40
  fixture:
    <<: *runtime
    command: [node, /workspace/tests/policy/runtime/provider.mjs]
    ports: ["127.0.0.1::8090"]
    volumes:
      - ${CEREBRO_S4_WORKTREE:?set worktree}:/workspace:ro
      - provider:/run/provider
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 5s
      retries: 40
volumes:
  minio:
  bundle:
  celld:
  provider:
